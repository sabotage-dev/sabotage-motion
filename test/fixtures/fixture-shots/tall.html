<!doctype html>
<!-- fixture-shots: a tall page for tools/shots.mjs (test/shots.test.mjs). 3000 CSS px tall on black, at a 135x240
     viewport: fourteen white landmarks, 4 px tall, at 200, 400 ... 2800 px, the k-th (from 0) 8 + 6k px wide, so a
     frame says which landmark is which; three things that move on their own, at the top right and the bottom:
     #css, a CSS animation 30 px to the right a second; #js, moved by a requestAnimationFrame loop from
     performance.now(), the same path; #bar, a scroll-driven animation that grows with the scroll. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: #000; }
body { height: 3000px; position: relative; }
.m { position: absolute; left: 0; height: 4px; background: #fff; }
#css, #js { position: fixed; left: 96px; width: 8px; height: 8px; }
#css { top: 4px; background: #f00; animation: right 1s linear infinite; }
#js { top: 16px; background: #0f0; }
#bar { position: fixed; left: 0; top: 232px; width: 135px; height: 4px; background: #00f; transform-origin: 0 0;
  animation: grow linear both; animation-timeline: scroll(root); }
@keyframes right { from { transform: translateX(0); } to { transform: translateX(30px); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style></head><body>
<div id="css"></div><div id="js"></div><div id="bar"></div>
<script>
for (let k = 0; k < 14; k++) {
  const d = document.createElement('div');
  d.className = 'm'; d.style.top = `${200 * (k + 1)}px`; d.style.width = `${8 + 6 * k}px`;
  document.body.appendChild(d);
}
const js = document.getElementById('js');
const step = () => { js.style.transform = `translateX(${30 * ((performance.now() / 1000) % 1)}px)`; requestAnimationFrame(step); };
step();
</script>
</body></html>

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Google Chrome
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            CHROME="$(command -v google-chrome || echo /opt/google/chrome/chrome)"
          fi
          if ! "$CHROME" --version; then
            echo "Google Chrome not found; installing it"
            npx --yes playwright-core install --with-deps chrome
            "$CHROME" --version
          fi

      - run: npm ci

      - name: doctor
        shell: bash
        run: |
          set -o pipefail
          npm run --silent doctor 2>&1 | tee doctor.txt
          { echo "### doctor (${{ matrix.os }}, node ${{ matrix.node }})"; echo '```'; cat doctor.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: ms per frame at full size (1080x1920, 8 subframes, 1 s of the default scene)
        shell: bash
        working-directory: skills/sabotage-motion/template
        run: |
          set -o pipefail
          node render.mjs video --to 1 --out out/bench.mp4 2>&1 | tee bench.txt
          { echo "### render speed (${{ matrix.os }}, node ${{ matrix.node }})"; echo '```'; grep -E '^video:|ms/frame' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: tests (determinism, frame count and container, alpha, scene swap, board sheet, cues and board timing, asset inventory)
        run: npm run test:engine && npm run test:voice && node --test test/assets.test.mjs

      # Informational only (never fails the job): which Linux GPU flags give WebGL2, and whether
      # Playwright's own Chromium works headless (plan Q5). Results go to the job summary.
      - name: WebGL2 flag variants (Linux, informational)
        if: runner.os == 'Linux' && matrix.node == 24
        continue-on-error: true
        shell: bash
        run: |
          { echo "### WebGL2 with other flag sets (ubuntu, informational)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for flags in "--enable-unsafe-swiftshader" "--use-angle=swiftshader" "--use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader" ""; do
            line=$(SM_GPU_ARGS="$flags" npm run --silent doctor 2>&1 | grep -E 'webgl2:' | head -1)
            echo "SM_GPU_ARGS='$flags' -> ${line:-no webgl2 line}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright's own Chromium (Q5, informational)
        if: matrix.node == 24
        continue-on-error: true
        shell: bash
        run: |
          npx playwright-core install chromium > /dev/null
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          set -o pipefail
          npm run --silent doctor 2>&1 | grep -E 'chrome:|webgl2|probe frame|doctor:' | sed -E 's#/(home|Users)/[^/]+#~#g' | tee pw.txt
          { echo "### doctor with Playwright's Chromium (${{ matrix.os }})"; echo '```'; cat pw.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  leak:
    name: leak test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Home paths in every tracked file, and the pre-push check's own tests on throwaway repos. The owner's
      # denylist is not on GitHub: the pre-push hook checks it on the owner's machine (scripts/leak.mjs).
      - name: leak test (home paths; pre-push check tests)
        run: node --test test/leak.test.mjs

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suites run in six shards per OS and node, so each job ends in about 20 minutes: on Ubuntu, installing ffmpeg
  # alone has taken from 1 to 13 minutes, and the suites took 28 minutes in one job at P11a. Each shard runs whole
  # npm test groups; test/docs.test.mjs checks that every test file is in a group a shard runs. The doctor, the render
  # speed and the informational steps run once per OS and node, in the engine shard.
  engine:
    name: engine (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.shard.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        shard:
          - name: engine
            what: determinism, frame count and container, alpha, scene swap, board sheet, render errors, cues and board timing, footage, code and terminal motion, a launch video for a repo, the examples, asset inventory, skill text
            run: npm run test:engine && npm run test:voice && npm run test:footage && npm run test:code && npm run test:launch && npm run test:examples && node --test test/assets.test.mjs test/docs.test.mjs
          - name: check
            what: check's detectors, fixture-check and the safe zones, the flash check
            run: npm run test:check && npm run test:flash
          - name: masters
            what: check --file on mixed masters, and flash as a file on the template card's tightest extreme looks
            run: npm run test:check-file
          - name: looks and mix
            what: looks and brand kits, mix and parity
            run: npm run test:looks && npm run test:mix
          - name: clip
            what: caption a clip
            run: npm run test:clip
          - name: energy
            what: the energy presets, the template card at each one, the bed stem
            run: npm run test:energy
          # the template card on all 8 looks, one shard per energy: about a minute a cell on Ubuntu's SwiftShader
          - name: card looks subtle
            what: the template card on every look at subtle
            run: npm run test:card-looks-subtle
          - name: card looks normal
            what: the template card on every look at normal, and type over its accent panel
            run: npm run test:card-looks-normal
          - name: card looks extreme
            what: the template card on every look at extreme, and type over its accent panel
            run: npm run test:card-looks-extreme
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Google Chrome
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            CHROME="$(command -v google-chrome || echo /opt/google/chrome/chrome)"
          fi
          if ! "$CHROME" --version; then
            echo "Google Chrome not found; installing it"
            npx --yes playwright-core install --with-deps chrome
            "$CHROME" --version
          fi

      - run: npm ci

      - name: doctor
        if: matrix.shard.name == 'engine'
        shell: bash
        run: |
          set -o pipefail
          npm run --silent doctor 2>&1 | tee doctor.txt
          { echo "### doctor (${{ matrix.os }}, node ${{ matrix.node }})"; echo '```'; cat doctor.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: ms per frame at full size (1080x1920, 8 subframes, 1 s of the default scene)
        if: matrix.shard.name == 'engine'
        shell: bash
        working-directory: skills/sabotage-motion/template
        run: |
          set -o pipefail
          node render.mjs video --to 1 --out "$RUNNER_TEMP/bench.mp4" 2>&1 | tee "$RUNNER_TEMP/bench.txt"
          { echo "### render speed (${{ matrix.os }}, node ${{ matrix.node }})"; echo '```'; grep -E '^video:|ms/frame' "$RUNNER_TEMP/bench.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: tests (${{ matrix.shard.what }})
        run: ${{ matrix.shard.run }}

      # Informational only (never fails the job): which Linux GPU flags give WebGL2, and whether
      # Playwright's own Chromium works headless (plan Q5). Results go to the job summary.
      - name: WebGL2 flag variants (Linux, informational)
        if: runner.os == 'Linux' && matrix.node == 24 && matrix.shard.name == 'engine'
        continue-on-error: true
        shell: bash
        run: |
          { echo "### WebGL2 with other flag sets (ubuntu, informational)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for flags in "--enable-unsafe-swiftshader" "--use-angle=swiftshader" "--use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader" ""; do
            line=$(SM_GPU_ARGS="$flags" npm run --silent doctor 2>&1 | grep -E 'webgl2:' | head -1)
            echo "SM_GPU_ARGS='$flags' -> ${line:-no webgl2 line}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Playwright's own Chromium (Q5, informational)
        if: matrix.node == 24 && matrix.shard.name == 'engine'
        continue-on-error: true
        shell: bash
        run: |
          npx playwright-core install chromium > /dev/null
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          set -o pipefail
          npm run --silent doctor 2>&1 | grep -E 'chrome:|webgl2|probe frame|doctor:' | sed -E 's#/(home|Users)/[^/]+#~#g' | tee pw.txt
          { echo "### doctor with Playwright's Chromium (${{ matrix.os }})"; echo '```'; cat pw.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  leak:
    name: leak test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Home paths in every tracked file, and the pre-push check's own tests on throwaway repos. The owner's
      # denylist is not on GitHub: the pre-push hook checks it on the owner's machine (scripts/leak.mjs).
      - name: leak test (home paths; pre-push check tests)
        run: node --test test/leak.test.mjs

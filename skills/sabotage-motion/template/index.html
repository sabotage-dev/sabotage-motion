<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title><link rel="icon" href="data:,">
<style>
/* Declare every face the scene uses, then list the family names in scene.js CFG.FONTS so a
   missing font fails the render instead of silently falling back to Times.
   The bundled faces are open-licence files in fonts/ (licences beside them), so a piece renders
   the same on macOS and Linux. They are Latin subsets (U+0000-00FF plus common punctuation);
   for other scripts or a brand face, copy the font file into fonts/ and point a face at it.
   `node render.mjs doctor` loads every face declared here. */
@font-face{font-family:DISPLAY;src:url('fonts/archivo-black-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:BODY;src:url('fonts/inter-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:MONO;src:url('fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2')}
html,body{margin:0;background:#000}
canvas{display:block;max-width:100vw;max-height:100vh}
</style></head>
<body><canvas id="c"></canvas><script type="module" src="main.js"></script></body></html>
